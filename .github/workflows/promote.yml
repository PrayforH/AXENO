name: promote-release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Workflow run ID that built the signed release
        required: true
        type: string
      source_commit:
        description: Exact lowercase commit SHA recorded by the release
        required: true
        type: string
      environment:
        description: Target environment; canary requires test, production requires canary
        required: true
        type: choice
        options: [test, canary, production]

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: harness-promotion-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, linux, harness-deploy]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ inputs.source_commit }}
          path: dist/release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.release_run_id }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - run: uv sync --frozen --group dev
        env:
          UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Verify signed manifest, artifact hashes, SBOMs, and image signatures
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --certificate-identity-regexp "^https://github.com/$REPOSITORY/.github/workflows/release.yml@" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --bundle dist/release/release-manifest.sigstore.json \
            dist/release/release-manifest.json
          uv run python scripts/release_manifest.py verify \
            --artifact-root dist/release \
            --manifest dist/release/release-manifest.json \
            --expected-commit "$EXPECTED_COMMIT"
          while IFS= read -r image; do
            cosign verify \
              --certificate-identity-regexp "^https://github.com/$REPOSITORY/.github/workflows/release.yml@" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$image" >/dev/null
          done < <(jq -r '.images[] | .reference + "@" + .digest' dist/release/release-manifest.json)
      - name: Deploy exact image digests and run forward migration/seed
        id: deploy
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          COMPOSE_ENV_FILE: ${{ vars.HARNESS_DEPLOY_ENV_FILE }}
          RELEASE_STATE_ROOT: ${{ vars.HARNESS_RELEASE_STATE_ROOT }}
        run: |
          set -euo pipefail
          test -n "$COMPOSE_ENV_FILE" && test -r "$COMPOSE_ENV_FILE"
          test -n "$RELEASE_STATE_ROOT"
          uv run python scripts/deploy_release.py apply \
            --compose-env "$COMPOSE_ENV_FILE" \
            --state-root "$RELEASE_STATE_ROOT" \
            --environment "$TARGET_ENVIRONMENT" \
            --artifact-root dist/release \
            --manifest dist/release/release-manifest.json
      - name: Apply Agent Eval/quality gates and promote exact package/image hashes
        env:
          HARNESS_API_BEARER_TOKEN: ${{ secrets.HARNESS_API_BEARER_TOKEN }}
          HARNESS_BASE_URL: ${{ vars.HARNESS_BASE_URL }}
          HARNESS_TENANT_ID: ${{ vars.HARNESS_TENANT_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          EXECUTION_PROFILE: ${{ vars.HARNESS_EXECUTION_PROFILE }}
        run: |
          set -euo pipefail
          test -n "$HARNESS_BASE_URL" && test -n "$HARNESS_TENANT_ID"
          uv run python scripts/promote_release.py promote \
            --base-url "$HARNESS_BASE_URL" \
            --tenant "$HARNESS_TENANT_ID" \
            --artifact-root dist/release \
            --manifest dist/release/release-manifest.json \
            --environment "$TARGET_ENVIRONMENT" \
            --execution-profile "${EXECUTION_PROFILE:-isolated-default}" \
            --plan work/promotion-plan.json
      - name: Black-box health gate
        env:
          HARNESS_BASE_URL: ${{ vars.HARNESS_BASE_URL }}
          HARNESS_WEB_URL: ${{ vars.HARNESS_WEB_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$HARNESS_BASE_URL/healthz" >/dev/null
          curl --fail --silent --show-error "$HARNESS_WEB_URL/studio/agents" >/dev/null
      - name: Roll back Agent snapshots after a failed post-promotion gate
        if: failure() && hashFiles('work/promotion-plan.json') != ''
        env:
          HARNESS_API_BEARER_TOKEN: ${{ secrets.HARNESS_API_BEARER_TOKEN }}
          HARNESS_BASE_URL: ${{ vars.HARNESS_BASE_URL }}
          HARNESS_TENANT_ID: ${{ vars.HARNESS_TENANT_ID }}
        run: |
          uv run python scripts/promote_release.py rollback \
            --base-url "$HARNESS_BASE_URL" \
            --tenant "$HARNESS_TENANT_ID" \
            --plan work/promotion-plan.json
      - name: Roll back application images after any failed deployment gate
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          COMPOSE_ENV_FILE: ${{ vars.HARNESS_DEPLOY_ENV_FILE }}
          RELEASE_STATE_ROOT: ${{ vars.HARNESS_RELEASE_STATE_ROOT }}
        run: |
          uv run python scripts/deploy_release.py rollback \
            --compose-env "$COMPOSE_ENV_FILE" \
            --state-root "$RELEASE_STATE_ROOT" \
            --environment "$TARGET_ENVIRONMENT"
