apiVersion: harness/v1alpha1
kind: Agent
metadata:
  name: echo-agent
  version: 0.3.0
  labels:
    purpose: local-validation
spec:
  runtime: claude-agent-sdk
  model:
    route: new-api-default
    model: deepseek-v4-pro
    fallbackRoute: anthropic-official
    fallbackModel: claude-sonnet-4-6
    requiredCapabilities: [streaming, tool_use]
  prompt:
    system: prompts/system.md
  skills: []
  tools:
    - builtin: Read
    - builtin: Glob
    - builtin: Grep
    - builtin: Write
    - builtin: Edit
    - builtin: Bash
    - builtin: Task
  subagents:
    - ref: helper-agent@1.0.0
  hooks: []
  permissions:
    policy: local-standard
  workspace:
    mode: isolated
    restoreSession: true
    archiveOnComplete: true
  limits:
    maxTurns: 5
    timeoutSeconds: 300
    maxBudgetUsd: 1
