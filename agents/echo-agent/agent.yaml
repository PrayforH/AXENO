apiVersion: harness/v1alpha1
kind: Agent
metadata:
  name: echo-agent
  version: 0.4.1
  labels:
    domain: harness-validation
    purpose: local-validation
spec:
  runtime: claude-agent-sdk
  model:
    route: deepseek-v4-pro
    model: deepseek-v4-pro
    requiredCapabilities: [streaming, tool_use]
  prompt:
    system: prompts/system.md
  skills:
    - skills/workspace-validation
  tools:
    - builtin: Read
    - builtin: Glob
    - builtin: Grep
    - builtin: Write
    - builtin: Edit
    - builtin: Bash
    - builtin: Task
  subagents:
    - ref: helper-agent@1.0.0
  hooks: []
  permissions:
    policy: production-orchestrator
  workspace:
    mode: isolated
    restoreSession: true
    archiveOnComplete: true
  limits:
    maxTurns: 12
    timeoutSeconds: 300
    maxBudgetUsd: 1
