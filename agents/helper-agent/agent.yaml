apiVersion: harness/v1alpha1
kind: Agent
metadata:
  name: helper-agent
  version: 1.0.0
  labels:
    domain: delegated-investigation
    purpose: delegated-investigation
spec:
  runtime: claude-agent-sdk
  model:
    route: new-api-default
    model: deepseek-v4-flash
    requiredCapabilities: [streaming, tool_use]
  prompt:
    system: prompts/system.md
  skills:
    - skills/delegated-investigation
  tools:
    - builtin: Read
    - builtin: Glob
    - builtin: Grep
  subagents: []
  hooks: []
  permissions:
    policy: production-read-only
  workspace:
    mode: isolated
    restoreSession: false
    archiveOnComplete: true
  limits:
    maxTurns: 6
    timeoutSeconds: 180
    maxBudgetUsd: 0.5
