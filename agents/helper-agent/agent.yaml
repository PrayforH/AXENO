apiVersion: harness/v1alpha1
kind: Agent
metadata:
  name: helper-agent
  version: 1.0.0
  labels:
    purpose: delegated-investigation
spec:
  runtime: claude-agent-sdk
  model:
    route: new-api-default
    model: claude-sonnet-4-6
    fallbackRoute: anthropic-official
    fallbackModel: claude-sonnet-4-6
    requiredCapabilities: [streaming, tool_use]
  prompt:
    system: prompts/system.md
  skills: []
  tools:
    - builtin: Read
    - builtin: Glob
    - builtin: Grep
  subagents: []
  hooks: []
  permissions:
    policy: local-standard
  workspace:
    mode: isolated
    restoreSession: false
    archiveOnComplete: true
  limits:
    maxTurns: 6
    timeoutSeconds: 180
    maxBudgetUsd: 0.5
