apiVersion: harness/v1alpha1
kind: Agent
metadata:
  name: tavily-live-agent
  version: 1.0.0
  labels:
    purpose: opt-in-live-smoke
spec:
  runtime: claude-agent-sdk
  model:
    route: new-api-default
    model: gateway-model
    requiredCapabilities: [streaming, tool_use]
  prompt:
    system: prompts/system.md
  skills: []
  tools:
    - mcp: tavily-readonly
  subagents: []
  hooks: []
  permissions:
    policy: local-standard
  workspace:
    mode: isolated
    restoreSession: false
    archiveOnComplete: false
  limits:
    maxTurns: 3
    timeoutSeconds: 120
    maxBudgetUsd: 0.5
