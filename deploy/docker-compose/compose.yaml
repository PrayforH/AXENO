x-python-image: &python-image
  image: claude-agent-harness-api:${HARNESS_IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: deploy/docker/api.Dockerfile
    args:
      UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}

x-harness-environment: &harness-environment
  HARNESS_ENVIRONMENT: production
  HARNESS_RUNTIME: claude-sdk
  HARNESS_DATABASE_URL: postgresql+asyncpg://harness:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/harness
  HARNESS_REDIS_URL: redis://redis:6379/0
  HARNESS_MINIO_ENDPOINT: minio:9000
  HARNESS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  HARNESS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  HARNESS_MINIO_BUCKET: harness-artifacts
  HARNESS_MINIO_SECURE: "false"
  HARNESS_NEW_API_BASE_URL: ${HARNESS_NEW_API_BASE_URL:?set HARNESS_NEW_API_BASE_URL}
  HARNESS_NEW_API_KEY: ${HARNESS_NEW_API_KEY:?set HARNESS_NEW_API_KEY}
  HARNESS_NEW_API_MODEL: ${HARNESS_NEW_API_MODEL:?set HARNESS_NEW_API_MODEL}
  HARNESS_SANDBOX_PROVIDER: ${HARNESS_SANDBOX_PROVIDER:-local}
  HARNESS_DAYTONA_API_KEY: ${HARNESS_DAYTONA_API_KEY:-}
  HARNESS_DAYTONA_API_URL: ${HARNESS_DAYTONA_API_URL:-https://app.daytona.io/api}
  HARNESS_DAYTONA_TARGET: ${HARNESS_DAYTONA_TARGET:-}
  HARNESS_DAYTONA_SNAPSHOT: ${HARNESS_DAYTONA_SNAPSHOT:-}
  HARNESS_MCP_SECRET_REFERENCES_JSON: ${HARNESS_MCP_SECRET_REFERENCES_JSON:-{}}
  HARNESS_MCP_SERVER_SECRETS_JSON: ${HARNESS_MCP_SERVER_SECRETS_JSON:-{}}
  HARNESS_OTEL_ENABLED: ${HARNESS_OTEL_ENABLED:-false}
  HARNESS_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  HARNESS_OTEL_SERVICE_NAME: claude-agent-harness

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/harness-artifacts
    restart: "no"

  migrate:
    <<: *python-image
    entrypoint: []
    command: ["alembic", "upgrade", "head"]
    environment: *harness-environment
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *python-image
    environment: *harness-environment
    ports:
      - "${HARNESS_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *python-image
    entrypoint: ["entrypoint-worker"]
    environment: *harness-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from pathlib import Path; raise SystemExit('harness-worker' not in Path('/proc/1/cmdline').read_text())"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    restart: unless-stopped

  seed:
    <<: *python-image
    entrypoint: []
    command: ["python", "scripts/seed_docker.py"]
    environment:
      HARNESS_API_URL: http://api:8000
      HARNESS_TENANT_ID: ${HARNESS_TENANT_ID:-local}
      HARNESS_USER_ID: ${HARNESS_USER_ID:-system}
      HARNESS_SEED_AGENT_MANIFEST: /app/agents/echo-agent/agent.yaml
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  web:
    image: claude-agent-harness-web:${HARNESS_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    environment:
      HARNESS_API_URL: http://api:8000
      HARNESS_AGENT_NAME: ${HARNESS_AGENT_NAME:-echo-agent}
      HARNESS_AGENT_VERSION: ${HARNESS_AGENT_VERSION:-0.1.0}
      HARNESS_TENANT_ID: ${HARNESS_TENANT_ID:-local}
      HARNESS_USER_ID: ${HARNESS_USER_ID:-developer}
      COPILOTKIT_TELEMETRY_DISABLED: "true"
    ports:
      - "${HARNESS_WEB_PORT:-3000}:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:?set LANGFUSE_OTLP_ENDPOINT}
      LANGFUSE_AUTHORIZATION: ${LANGFUSE_AUTHORIZATION:?set LANGFUSE_AUTHORIZATION}
    volumes:
      - ../otel-collector/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
