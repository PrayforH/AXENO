    image: ${HARNESS_API_IMAGE:?set HARNESS_API_IMAGE}
  api:
    image: ${HARNESS_API_IMAGE:?set HARNESS_API_IMAGE}
  worker:
    image: ${HARNESS_API_IMAGE:?set HARNESS_API_IMAGE}
  quality-sync:
    image: ${HARNESS_API_IMAGE:?set HARNESS_API_IMAGE}
  seed:
    image: ${HARNESS_API_IMAGE:?set HARNESS_API_IMAGE}
  web:
    image: ${HARNESS_WEB_IMAGE:?set HARNESS_WEB_IMAGE}
