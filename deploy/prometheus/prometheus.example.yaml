global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: harness-api
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/harness_api_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: harness-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8001"]
